[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Rewrite /api/contact to the Netlify Function (preserving the client URL)
[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200

# Single Page Application (SPA) fallback for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
